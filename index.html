<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svitlo Monitor Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#111215',
                        cardBg: '#1b1c21',
                        borderSubtle: '#2a2b34',
                        accentOrange: '#ff8800',
                        glowOrange: '#ff6600',
                        accentBlue: '#5856d6',
                        textMuted: '#8e8e93'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #111215; color: #ffffff; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        .glow-orange { box-shadow: 0 0 25px rgba(255, 136, 0, 0.5), inset 0 0 10px rgba(255, 136, 0, 0.4); }
        .glow-orange-lg { box-shadow: 0 0 45px rgba(255, 120, 0, 0.6); }
        .glow-dark { box-shadow: 0 0 15px rgba(88, 86, 214, 0.2); }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
        .animate-glow { animation: pulseGlow 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative overflow-x-hidden pb-24">

    <!-- Header -->
    <header class="p-4 flex items-center justify-between border-b border-borderSubtle/50 bg-darkBg/80 backdrop-blur sticky top-0 z-40">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-bold text-black text-sm">⚡</div>
            <div>
                <h1 class="text-sm font-bold leading-tight">Myloslavska Svitlo <i class="fa-solid fa-lightbulb text-amber-400 text-xs"></i></h1>
                <p id="connectionStatus" class="text-[10px] text-textMuted">Завантаження даних...</p>
            </div>
        </div>
        <button onclick="loadRealData()" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-borderSubtle hover:bg-neutral-800 text-amber-400 border border-amber-500/30 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-rotate"></i> Оновити
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 space-y-4 flex-1">
        <div id="tab-zaraz" class="tab-content space-y-4">
            
            <!-- Graphic Header -->
            <div class="relative w-full h-36 bg-gradient-to-b from-neutral-900 to-cardBg rounded-2xl overflow-hidden border border-borderSubtle flex items-center justify-center">
                <div class="relative z-10 flex flex-col items-center">
                    <div id="houseIconBg" class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-1 transition-all duration-500">
                        <i id="houseIcon" class="fa-solid fa-city text-4xl text-amber-400"></i>
                    </div>
                </div>
            </div>

            <!-- Main Status Card -->
            <div class="bg-cardBg rounded-2xl p-5 border border-borderSubtle shadow-xl relative overflow-hidden">
                <div class="flex items-center gap-4">
                    <div class="relative flex-shrink-0">
                        <div id="statusGlowRing" class="w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 glow-orange glow-orange-lg animate-glow flex items-center justify-center transition-all duration-500">
                            <div class="w-6 h-6 rounded-full bg-white/90 shadow-inner"></div>
                        </div>
                    </div>
                    <div class="flex-1">
                        <h2 id="statusTitle" class="text-2xl font-extrabold tracking-tight text-white">Перевірка...</h2>
                        <p id="statusSubtext" class="text-xs text-textMuted font-medium mt-0.5">Очікування даних з розетки</p>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-borderSubtle/60 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-darkBg border border-borderSubtle text-amber-400 font-semibold">
                        <i class="fa-solid fa-plug text-xs"></i>
                        <span id="voltageVal">Tuya Cloud</span>
                    </div>
                    <span id="lastUpdated" class="text-textMuted">Щойно</span>
                </div>
            </div>

            <!-- History log preview -->
            <div class="bg-cardBg rounded-2xl p-5 border border-borderSubtle space-y-3">
                <h3 class="text-sm font-bold text-textMuted uppercase tracking-wider">Останні події з розетки</h3>
                <div id="logsContainer" class="space-y-2 text-xs text-textMuted">
                    Завантаження історії...
                </div>
            </div>
        </div>

        <!-- TAB: ІСТОРІЯ -->
        <div id="tab-istoriya" class="tab-content hidden space-y-4">
            <div class="bg-cardBg rounded-2xl p-5 border border-borderSubtle space-y-4">
                <h3 class="text-base font-bold">Повний журнал подій</h3>
                <div id="fullLogsContainer" class="space-y-2.5 text-xs">
                    Завантаження...
                </div>
            </div>
        </div>

        <!-- TAB: НАЛАШТУВАННЯ -->
        <div id="tab-settings" class="tab-content hidden space-y-4">
            <div class="bg-cardBg rounded-2xl p-5 border border-borderSubtle space-y-4 text-xs">
                <h3 class="text-base font-bold">Конфігурація</h3>
                <p class="text-textMuted">Дані автоматично оновлюються фоновим роботом GitHub Actions прямо з вашої розетки Tuya.</p>
            </div>
        </div>
    </main>

    <!-- NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-cardBg/95 backdrop-blur border-t border-borderSubtle p-2 z-50">
        <div class="grid grid-cols-3 gap-1">
            <button onclick="switchTab('zaraz')" id="nav-zaraz" class="nav-btn py-2 px-1 rounded-xl flex flex-col items-center gap-1 text-amber-400 bg-darkBg border border-amber-500/40 transition">
                <i class="fa-solid fa-bolt text-base"></i>
                <span class="text-[10px] font-bold">Статус</span>
            </button>
            <button onclick="switchTab('istoriya')" id="nav-istoriya" class="nav-btn py-2 px-1 rounded-xl flex flex-col items-center gap-1 text-textMuted hover:text-white transition">
                <i class="fa-solid fa-chart-column text-base"></i>
                <span class="text-[10px] font-bold">Історія</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn py-2 px-1 rounded-xl flex flex-col items-center gap-1 text-textMuted hover:text-white transition">
                <i class="fa-solid fa-sliders text-base"></i>
                <span class="text-[10px] font-bold">Про систему</span>
            </button>
        </div>
    </nav>

    <!-- SCRIPT LOGIC TO FETCH REAL DATA -->
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function loadRealData() {
            try {
                // Читаем файл logs.json из вашего репозитория GitHub Pages
                const response = await fetch('logs.json?r=' + Math.random());
                if (!response.ok) throw new Error('Файл логів ще не створено роботом');
                
                const logs = await response.json();
                if (logs.length === 0) return;

                const lastLog = logs[logs.length - 1];
                const isOnline = lastLog.status === 'online';

                updateUI(isOnline, lastLog.time, logs);
            } catch (err) {
                document.getElementById('connectionStatus').textContent = "Очікування першого запуску GitHub Action";
            }
        }

        function updateUI(isOnline, timeStr, logs) {
            const glowRing = document.getElementById('statusGlowRing');
            const statusTitle = document.getElementById('statusTitle');
            const statusSubtext = document.getElementById('statusSubtext');
            const houseIcon = document.getElementById('houseIcon');
            const houseIconBg = document.getElementById('houseIconBg');
            const connStatus = document.getElementById('connectionStatus');

            if (isOnline) {
                glowRing.className = "w-14 h-14 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 glow-orange glow-orange-lg animate-glow flex items-center justify-center transition-all duration-500";
                statusTitle.textContent = "Світло є";
                statusTitle.className = "text-2xl font-extrabold tracking-tight text-white";
                statusSubtext.textContent = "Останній оновлений статус: " + timeStr;
                houseIcon.className = "fa-solid fa-city text-4xl text-amber-400";
                houseIconBg.className = "w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-1";
                connStatus.textContent = "Розетка в мережі (Online)";
            } else {
                glowRing.className = "w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-slate-700 glow-dark flex items-center justify-center transition-all duration-500";
                statusTitle.textContent = "Світла немає";
                statusTitle.className = "text-2xl font-extrabold tracking-tight text-indigo-300";
                statusSubtext.textContent = "Зникло о: " + timeStr;
                houseIcon.className = "fa-solid fa-city text-4xl text-slate-600";
                houseIconBg.className = "w-20 h-20 rounded-2xl bg-slate-800/40 border border-slate-700 flex items-center justify-center mb-1";
                connStatus.textContent = "Розетка недоступна (Offline)";
            }

            // Рендер истории
            const container = document.getElementById('logsContainer');
            const fullContainer = document.getElementById('fullLogsContainer');
            let htmlLogs = '';
            
            logs.slice(-5).reverse().forEach(log => {
                const badgeColor = log.status === 'online' ? 'text-amber-400' : 'text-indigo-400';
                htmlLogs += `<div class="flex justify-between border-b border-borderSubtle/40 py-1.5">
                    <span>${log.time}</span>
                    <span class="${badgeColor} font-bold">${log.status.toUpperCase()}</span>
                </div>`;
            });
            container.innerHTML = htmlLogs;
            fullContainer.innerHTML = htmlLogs;
            document.getElementById('lastUpdated').textContent = "Оновлено: " + timeStr;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = "nav-btn py-2 px-1 rounded-xl flex flex-col items-center gap-1 text-textMuted hover:text-white transition";
            });
            document.getElementById('nav-' + tabId).className = "nav-btn py-2 px-1 rounded-xl flex flex-col items-center gap-1 text-amber-400 bg-darkBg border border-amber-500/40 transition";
        }

        // Автозагрузка при старте
        loadRealData();
        setInterval(loadRealData, 30000); // Проверка каждые 30 секунд
    </script>
</body>
</html>
